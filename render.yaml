services:
  # ==================== MARIA DB ====================
  - type: pserv
    name: openemr-db
    runtime: image
    image:
      url: mariadb:11
    plan: starter
    region: oregon
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: SuperSecureRootPass123!     # ← CHANGE THIS
      - key: MYSQL_DATABASE
        value: openemr
      - key: MYSQL_USER
        value: openemr
      - key: MYSQL_PASSWORD
        value: SuperSecureUserPass456!     # ← CHANGE THIS
    disk:
      name: mariadb-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  # ==================== OPENEMR WEB APP ====================
  - type: web
    name: openemr-app
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: MYSQL_HOST
        fromService:
          name: openemr-db
          type: pserv
          property: host
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_ROOT_PASS
        fromService:
          name: openemr-db
          type: pserv
          envVarKey: MYSQL_ROOT_PASSWORD
      - key: MYSQL_USER
        value: openemr
      - key: MYSQL_PASS
        fromService:
          name: openemr-db
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: MYSQL_DATABASE
        value: openemr
      - key: OE_USER
        value: admin
      - key: OE_PASS
        value: YourStrongAdminPass789!     # ← CHANGE THIS
      - key: FORCE_HTTPS
        value: "true"
      - key: SITE
        value: default
    disk:
      name: openemr-sites
      mountPath: /var/www/localhost/htdocs/openemr/sites
      sizeGB: 10
